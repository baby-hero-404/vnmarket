[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnmarket"
version = "1.0.1"
description = "Client-side Python toolkit for Vietnamese market data: connect, standardize, analyze."
readme = "README.md"
authors = [
  { name = "Personal Fork" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["vnmarket", "finance", "vietnam", "stock market", "analysis", "API"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Vietnamese",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "pydantic>=2.0.0",
    "packaging>=20.0",
    "tenacity>=8.2.0",
    "pytz",
]

[project.urls]
Homepage = "https://github.com/baby-hero-404/vnmarket"
Repository = "https://github.com/baby-hero-404/vnmarket.git"
Issues = "https://github.com/baby-hero-404/vnmarket/issues"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout"]
dev = ["pre-commit", "ruff", "pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout"]

[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
exclude = ["build*", "dist*", "tests*", "notebooks*", "scripts*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long, handled by ruff-format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
norecursedirs = ["tests/archived"]
addopts = "--ignore-glob='*tcbs*'"
